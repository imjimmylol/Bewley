# config/0313/incomplete_nonlinear_high_uncer_hn.yaml
# Incomplete markets (high uncertainty σ_v=0.5), non-linear (progressive/HSV-style) tax

# Experiment name
exp_name: "Bewley_Hetero_ability_low_uncer_nonlinear_HardNorm"

training:
  agents: 50
  learning_rate: 1e-4
  training_steps: 50000
  batch_size: 32
  display_step: 5000
  plot_interval: 500
  train_step_interval: 4
  cluster_interval: 1000
  save_interval: 10000
  normalizer: "hard"

bewley_model:
  theta: 1.0         # CRRA
  beta: 0.96         # Discount factor
  A: 1.0             # Technology parameter
  alpha: 0.33        # Capital share of income
  gamma: 2.0         # Inverse Frisch elasticity
  r: 0.04            # Interest rate (return to savings)
  delta: 0.06        # Depreciation rate of capital
  fix: false         # Incomplete markets: ability transitions with AR(1) + superstar shocks

initial_state:
  moneydisposable_mean: 2.0
  moneydisposable_std: 0.5
  assets_mean: 1.0
  assets_std: 0.5

  ability_init_method: "iq_like"
  ability_mean: 10
  ability_cv: 0.3
  ability_min: 3.0
  ability_max: 30.0

tax_params:
  tax_consumption: 0
  tax_income: 0.3
  tax_saving: 0.1
  income_tax_elasticity: 0.18
  saving_tax_elasticity: 0.1

shock:
  rho_v: 0.98
  sigma_v: 0.2
  v_bar: 5
  p: 2.2e-6
  q: 0.95
